server:
  port: 8081
  servlet:
    context-path: /system
spring:
  application:
    name: system-service
  datasource:
    url: jdbc:postgresql://localhost:5432/xiao_lin?stringtype=unspecified
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-value: "your-256-bit-secret-key-must-be-at-least-32-chars"
logging:
  level:
    # JdbcTemplate 执行的 SQL + 参数
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    # 绑定参数的详细值
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

    # （可选）Spring Data JDBC 仓库方法调用
    org.springframework.data.jdbc.repository.query: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.web: DEBUG
